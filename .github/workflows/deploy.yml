name: Deploy nila

# Deploys on every push to main; still triggerable by hand via the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one prod deploy at a time; a newer push cancels an in-flight one so two
# deploys can't interleave on the server.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kaguyahq/nila

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-arm64,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::500763019925:role/NilaGitHubDeployRole
          aws-region: ap-south-2
          allowed-account-ids: "500763019925"

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids i-0547b7fd7907f3a21 \
            --document-name AWS-RunShellScript \
            --comment "Deploy Nila ${GITHUB_SHA}" \
            --parameters 'commands=["cd /opt/nila && ./deploy.sh"]' \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-0547b7fd7907f3a21 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-0547b7fd7907f3a21 \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-0547b7fd7907f3a21 \
                  --query '[StandardOutputContent,StandardErrorContent]' \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment command $command_id" >&2
          exit 1
