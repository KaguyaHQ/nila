# Nila production stack — lives at /home/deploy/nila on the Hetzner box.
#
# This is a SEPARATE compose project from kaguya. The `nila` app container
# joins the shared external `edge` network so kaguya's Caddy can reach it as
# `nila:8080`. Postgres stays on the private `internal` network only.
#
# One-time prerequisite on the server:
#     docker network create edge
#
# See hetzner/README.md for the full bootstrap.

networks:
  edge:
    external: true
  internal:
    driver: bridge

services:
  nila:
    image: ghcr.io/kaguyahq/nila:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - PHX_SERVER=true
      - PORT=8080
      - PHX_HOST=nilahq.com
    networks:
      edge:
        aliases:
          - nila
      internal: {}
    expose:
      - "8080"
    depends_on:
      nila-postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      # X-Forwarded-Proto header so force_ssl treats the internal probe as https
      # and doesn't 301 it.
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/health | grep -q healthy",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nila-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - internal
    volumes:
      - nila_pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nila_pgdata:
